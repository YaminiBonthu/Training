<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <div class="logo">
                Foodie
            </div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Restaurants</a>
                <a href="#">Orders</a>
                <a href="#">Contact</a>
                <a href="#">Login</a>
            </div>
        </nav>
    </header>
    <!-- Hero Section -->
    <section class="hero">
        <h1>Delicious food, delivered fast</h1>
        <p>
            Order your favorite food from nearby restaurants
        </p>
        <button>Order Now</button>
    </section>
    <!-- Restaurant Section -->
    <section class="restaurants">
        <h2>Popular Restaurants</h2>
        <div class="restaurant-container">
            <!-- Restaurant 1 -->
            <div class="restaurant-card">
                <h3>Restaurant 1</h3>
                <p class="rating">⭐ 4.5</p>
                <a href="#">View Menu</a>
            </div>
            <!-- Restaurant 2 -->
            <div class="restaurant-card">
                <h3>Restaurant 2</h3>
                <p class="rating">⭐ 4.3</p>
                <a href="#">View Menu</a>
            </div>
            <!-- Restaurant 3 -->
            <div class="restaurant-card">
                <h3>Restaurant 3</h3>
                <p class="rating">⭐ 4.7</p>
                <a href="#">View Menu</a>
            </div>
        </div>
    </section>
    <!-- Footer -->
    <footer>
        <p>
            © 2026 Foodie. All rights reserved
        </p>
    </footer>
</body>
</html>
